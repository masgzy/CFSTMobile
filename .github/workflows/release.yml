name: Release

# 推送 v* 标签时自动构建并发布 prerelease：
#   1. 引擎 .so（arm64-v8a / armeabi-v7a / x86_64，16KB 页对齐）挂到 Release 附件
#   2. app/ 工程存在时：下载 .so → 组装进 jniLibs → 正式签名 APK（Secrets 证书）
#      + R8 mapping.txt，参数与 ci.yml 保持一致，产物统一重命名后上传。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  detect:
    name: 探测 app 工程是否存在
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app_present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f app/build.gradle.kts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  engine-so:
    name: 构建引擎 .so（多 ABI）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust stable（含 Android 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: 安装 cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: 构建引擎 .so（release，含 16KB 对齐）
        run: |
          chmod +x engine/build-so.sh
          ./engine/build-so.sh

      # 保留 <abi>/ 目录结构，解压到 app/src/main/jniLibs 即可被 Gradle 拾取
      - name: 打包 jniLibs（保持 ABI 目录结构）
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' engine/Cargo.toml | head -1)
          echo "ENGINE_VERSION=$VERSION" >> "$GITHUB_ENV"
          cd app/src/main
          zip -r "cfst-engine-$VERSION-jniLibs.zip" jniLibs
          ls -lh "cfst-engine-$VERSION-jniLibs.zip"

      # upload-artifact v7 打包模式：artifact 名 = name 参数（注意 archive: false
      # 直传模式下 artifact 注册名会变成文件名本身，下游按 name 下载会 404），
      # 供 android-apk job 的 download-artifact@v8 复用（自动解压出 jniLibs zip）
      - name: 上传 jniLibs zip
        uses: actions/upload-artifact@v7
        with:
          name: cfst-engine-jniLibs
          path: app/src/main/cfst-engine-*-jniLibs.zip

      - name: 发布引擎 .so 到 GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --title "CFSTMobile $TAG" --generate-notes --prerelease
          gh release upload "$TAG" "app/src/main/cfst-engine-$ENGINE_VERSION-jniLibs.zip"

  # App 工程落地后自动启用；.so 由 engine-so job 产物注入
  android-apk:
    name: 构建签名 APK
    needs: [detect, engine-so]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: needs.detect.outputs.app_present == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: 注入引擎 .so（engine-so 产物 -> jniLibs）
        uses: actions/download-artifact@v8
        with:
          name: cfst-engine-jniLibs
          path: app/src/main

      - name: 解压 jniLibs
        run: |
          cd app/src/main
          unzip -o cfst-engine-*-jniLibs.zip
          find jniLibs -name 'libcfst.so' -exec ls -lh {} \;

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 自签证书由 repo Secrets 提供（与 ci.yml 同一套），保证各版本
      # 签名一致：可直接覆盖安装升级，无需先卸载。
      - name: 恢复签名证书（Secrets -> keystore.properties）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 --decode > signing/cfst-release.jks
          # 用 echo 逐行生成而非 heredoc：heredoc 会继承 YAML 缩进，
          # 前导空格会被 java.util.Properties 当作续行处理
          {
            echo "storeFile=signing/cfst-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "keystore.properties 已生成，证书指纹："
          keytool -list -v -keystore signing/cfst-release.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | grep SHA256 || true

      - name: Gradle 依赖缓存
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 构建 R8 收缩的签名 APK（多 ABI + universal）
        run: ./gradlew :app:assembleRelease --no-daemon

      # 产物重命名为 CFSTMobile-<版本>-<abi>.apk
      - name: 产物清单（统一重命名）
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          OUT=app/build/outputs/apk/release
          mkdir -p "$OUT/renamed"
          for f in "$OUT"/*-release.apk; do
            case "$f" in
              *arm64-v8a*)   ABI=arm64-v8a ;;
              *armeabi-v7a*) ABI=armeabi-v7a ;;
              *x86_64*)      ABI=x86_64 ;;
              *)             ABI=universal ;;
            esac
            mv "$f" "$OUT/renamed/CFSTMobile-$VERSION-$ABI.apk"
          done
          ls -lh "$OUT/renamed"
          echo "APK_DIR=$OUT/renamed" >> "$GITHUB_ENV"

      - name: 上传 APK 附件到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" "$APK_DIR"/*.apk --clobber

      # R8 混淆映射：崩溃堆栈还原用（retrace mapping.txt stacktrace）
      - name: 上传 mapping.txt（R8 混淆映射）
        if: hashFiles('app/build/outputs/mapping/release/mapping.txt') != ''
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: app/build/outputs/mapping/release/mapping.txt
